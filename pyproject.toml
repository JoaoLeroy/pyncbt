[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyncbt"
version = "0.1.7"            
description = "Non-iterative Correlation-based Tuning (NCbT) for data-driven control"

readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "João P. M. Leroy" }]
keywords = ["data-driven control", "NCbT", "control", "identification", "SISO", "LTI", "python"]
dependencies = [
    "numpy",
    "scipy",
    "control",
    "matplotlib"
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Control Systems",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/JoaoLeroy/pyncbt"
Documentation = "https://joaoleroy.github.io/pyncbt/" 
Source = "https://github.com/JoaoLeroy/pyncbt"
Issues = "https://github.com/JoaoLeroy/pyncbt/issues"

[tool.setuptools.packages.find]
where = ["scr"]

[tool.setuptools.package-dir]
"" = "scr"
