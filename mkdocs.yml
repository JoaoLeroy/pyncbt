site_name: pyncbt
site_url: https://JoaoLeroy.github.io/pyncbt/
repo_url: https://github.com/JoaoLeroy/pyncbt
site_description: Non-iterative Correlation-based Tuning in Python

theme:
  name: material
  language: pt-BR
  logo: docs/img/pyncbt-logo.png 
  favicon: docs/img/pyncbt-logo.png 
  palette:
    - scheme: default # Modo claro
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate # Modo escuro
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs # Menu no topo igual sites grandes
    - navigation.sections
    - navigation.top # Botão de "voltar ao topo"
    - content.code.copy # Botão de copiar código
    - content.code.annotate

nav:
  - Home: index.md
  - Installation: installation.md
  - NCbT Overview: ncbt_overview.md
  - Tutorials:
      - Open-loop data: tutorials/open_loop.md
      - Closed-loop data: tutorials/closed_loop.md
  - API Reference: api.md
  
plugins:
  - search